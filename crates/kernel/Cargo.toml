[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features=["unicode"] }
nerdfont-bitmap = { path = "../nerdfont-bitmap" }
goblin = { version = "0.10.7", default-features = false, features = ["alloc", "endian_fd", "elf32", "elf64"] }
linked_list_allocator = "0.10.6"
shared = { path="../shared" }
drm-uapi = { path = "../drm-uapi" }
acpi = "6.1.1"
aml = "0.16.4"
smoltcp = { version = "0.11", default-features = false, features = ["alloc", "proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet"] }

[features]
default = []
dsp_verbose = []
trace_syscalls = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
